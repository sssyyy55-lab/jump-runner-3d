<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3Dジャンプランナー</title>

<!-- iPhoneのホーム画面に追加した際のアイコン・見た目の設定 -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ジャンプランナー">
<meta name="theme-color" content="#1d2b4f">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --shu:#c23b22;
    --kon:#1d2b4f;
    --bg1:#0b1330;
    --bg2:#1d2b4f;
    --text:#f5f0e6;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:linear-gradient(#05010f,#3a0a5c 60%,#ff2fa0);
    overflow:hidden;
    font-family:"Hiragino Sans","Meiryo",sans-serif;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #canvas-wrap{ position:fixed; inset:0; }
  canvas{ display:block; width:100%; height:100%; }

  #hud{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:16px 20px; box-sizing:border-box;
    color:var(--text); pointer-events:none;
    text-shadow:0 2px 6px rgba(0,0,0,.45);
  }
  #score{ font-size:28px; font-weight:700; letter-spacing:1px; }
  #best{ font-size:14px; opacity:.85; margin-top:2px; }

  #hint{
    position:fixed; bottom:22px; left:0; right:0;
    text-align:center; color:var(--text);
    font-size:14px; opacity:.85; pointer-events:none;
    text-shadow:0 2px 6px rgba(0,0,0,.45);
  }

  #overlay{
    position:fixed; inset:0;
    background:rgba(10,15,35,.72);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text); text-align:center; padding:24px; box-sizing:border-box;
    backdrop-filter:blur(2px);
  }
  #overlay.hidden{ display:none; }
  #overlay h1{
    font-size:clamp(24px,7vw,40px); margin:0 0 8px; color:var(--shu);
    text-shadow:0 3px 10px rgba(0,0,0,.5);
  }
  #overlay p{ margin:4px 0 20px; font-size:15px; opacity:.9; line-height:1.7; }
  #finalScore{ font-size:20px; margin-bottom:22px; }
  #finalScore b{ color:#ffd76a; font-size:26px; }

  button{
    font-family:inherit; font-size:18px; font-weight:700;
    padding:14px 40px; border-radius:30px; border:none;
    background:var(--shu); color:#fff; cursor:pointer;
    box-shadow:0 6px 18px rgba(194,59,34,.5);
    -webkit-tap-highlight-color:transparent;
  }
  button:active{ transform:scale(0.96); }

  #stageMsg{
    position:fixed; top:38%; left:0; right:0;
    text-align:center; pointer-events:none;
    font-size:clamp(20px,6vw,34px); font-weight:700;
    color:#fff; letter-spacing:2px;
    text-shadow:0 0 12px rgba(0,229,255,.9), 0 0 24px rgba(255,47,160,.7);
    opacity:0; transition:opacity .6s ease;
  }
  #stageMsg.show{ opacity:1; }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="hud">
  <div>
    <div id="score">0 m</div>
    <div id="best">ベスト: 0 m</div>
  </div>
</div>

<div id="hint">タップ/スペース: ジャンプ　←→キー・左右スワイプ: レーン移動</div>
<div id="stageMsg"></div>

<div id="overlay">
  <h1>3Dジャンプランナー</h1>
  <p>ジャンプで障害物を飛び越え、左右のレーン移動もうまく使って<br>できるだけ長く走り続けよう!<br><span style="opacity:.75;font-size:13px;">※800m地点でネオン都市の夜景に切り替わります</span></p>
  <button id="startBtn">スタート</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

(function(){
  "use strict";

  // ---------- 基本セットアップ ----------
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();

  // ステージ1:江戸の街並み(夕暮れの空、浮世絵風グラデーション)
  function createEdoSkyTexture(){
    const canvas = document.createElement('canvas');
    canvas.width = 2; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0.0, '#152238');   // 上空:藍色
    grad.addColorStop(0.5, '#3d4f7a');
    grad.addColorStop(0.8, '#c97b52');   // 地平線付近:夕焼け
    grad.addColorStop(1.0, '#e8a765');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 2, 512);
    return new THREE.CanvasTexture(canvas);
  }

  // ステージ2:ネオン都市の夜空(紫〜マゼンタのグラデーション+簡易スターフィールド)
  function createNeonSkyTexture(){
    const canvas = document.createElement('canvas');
    canvas.width = 2; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0.0, '#05010f');   // 上空:ほぼ黒
    grad.addColorStop(0.45, '#170a3a');  // 深い紫
    grad.addColorStop(0.75, '#6a1f8f');  // ネオンパープル
    grad.addColorStop(1.0, '#ff2fa0');   // 地平線:マゼンタの発光
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 2, 512);
    // 星(上空側にだけ、ランダムな光点)
    for(let i=0;i<40;i++){
      const y = Math.random()*230;
      const alpha = 0.3 + Math.random()*0.5;
      ctx.fillStyle = 'rgba(200,230,255,' + alpha.toFixed(2) + ')';
      ctx.fillRect(Math.random()<0.5?0:1, y, 1, 1);
    }
    return new THREE.CanvasTexture(canvas);
  }

  const edoSkyTexture = createEdoSkyTexture();
  const neonSkyTexture = createNeonSkyTexture();
  scene.background = edoSkyTexture;
  scene.fog = new THREE.Fog(0x8a6a58, 20, 75);

  const camera = new THREE.PerspectiveCamera(66, window.innerWidth/window.innerHeight, 0.1, 200);
  camera.position.set(0, 6.3, 10);
  camera.lookAt(0, 1, -5);

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  wrap.appendChild(renderer.domElement);

  // ---------- ライト(ステージごとに色・強さを切り替える) ----------
  const hemi = new THREE.HemisphereLight(0xffd9a0, 0x3b2b20, 0.95);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffb066, 1.05);
  sun.position.set(5, 12, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
  sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
  scene.add(sun);
  // 街を下から照らすネオンの反射光(マゼンタ、ステージ2でのみ点灯)
  const neonFill = new THREE.PointLight(0xff2fa0, 0, 60);
  neonFill.position.set(0, 4, -5);
  scene.add(neonFill);

  // ---------- 色(ステージ1:江戸 / ステージ2:ネオン都市) ----------
  const COLOR_SHU = 0xc23b22;
  const COLOR_KON = 0x1d2b4f;
  // 江戸(木造の町並み)
  const EDO_COLOR_GROUND = 0x8a7358;   // 町の地面(踏み固めた土の色)
  const EDO_COLOR_LANE = 0x7a6a52;     // 街道(土の道)
  const EDO_COLOR_WOOD_A = 0x4a3728;   // 町家の木材(濃いめ)
  const EDO_COLOR_WOOD_B = 0x5c4433;   // 町家の木材(やや明るめ)
  const EDO_COLOR_ROOF = 0x2b2b2b;     // 瓦屋根
  const EDO_COLOR_LANTERN = 0xc23b22;  // 提灯(赤)
  // ネオン都市(高層ビル)
  const NEON_COLOR_GROUND = 0x0c0818;  // 街の地面(アスファルトの黒)
  const NEON_COLOR_LANE = 0x120a20;    // 走路(夜のアスファルト)
  const NEON_COLOR_WOOD_A = 0x161028;  // ビル本体(濃いめ)
  const NEON_COLOR_WOOD_B = 0x1e1638;  // ビル本体(やや明るめ)
  const NEON_COLOR_ROOF = 0x0a0614;    // ビル屋上
  const NEON_ACCENTS = [0x00e5ff, 0xff2fa0, 0xb14aff, 0x39ff8f]; // シアン/マゼンタ/紫/グリーンのネオン差し色

  // 現在ステージで使う色(switchStageで書き換える)
  let COLOR_WOOD_A = EDO_COLOR_WOOD_A;
  let COLOR_WOOD_B = EDO_COLOR_WOOD_B;
  let COLOR_ROOF = EDO_COLOR_ROOF;

  // ---------- 地面(3レーン) ----------
  const LANE_WIDTH = 3;           // 1レーンの幅
  const LANE_COUNT = 3;           // レーン数
  const lanePositions = [-LANE_WIDTH, 0, LANE_WIDTH]; // 各レーンのx座標(左・中央・右)
  const TOTAL_WIDTH = LANE_WIDTH * LANE_COUNT;

  const groundGeo = new THREE.PlaneGeometry(TOTAL_WIDTH, 400);
  const groundMat = new THREE.MeshStandardMaterial({ color: EDO_COLOR_LANE });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.z = -180;
  ground.receiveShadow = true;
  scene.add(ground);

  // 左右の地面(装飾、1つの共有マテリアルで両側を塗るのでステージ切替時は一括で色変更できる)
  const sideGroundMat = new THREE.MeshStandardMaterial({ color: EDO_COLOR_GROUND });
  [-1,1].forEach(function(side){
    const g = new THREE.Mesh(new THREE.PlaneGeometry(30, 400), sideGroundMat);
    g.rotation.x = -Math.PI/2;
    g.position.set(side*(TOTAL_WIDTH/2 + 15), -0.01, -180);
    g.receiveShadow = true;
    scene.add(g);
  });

  // レーンの区切り線(左右2本、共有マテリアルでステージごとに色・発光を切り替える)
  const laneDividerMat = new THREE.MeshStandardMaterial({color:0xd9cbb0, transparent:true, opacity:0.45});
  [-LANE_WIDTH/2, LANE_WIDTH/2].forEach(function(x){
    const div = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 400), laneDividerMat);
    div.rotation.x = -Math.PI/2;
    div.position.set(x, 0.005, -180);
    scene.add(div);
  });

  // レース場の縁石(赤白のカーブ風、ステージ2でのみ表示する)
  const kerbGroup = new THREE.Group();
  [-TOTAL_WIDTH/2 - 0.15, TOTAL_WIDTH/2 + 0.15].forEach(function(x){
    for(let i=0;i<50;i++){
      const kerb = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.12, 3.6),
        new THREE.MeshStandardMaterial({
          color: i % 2 === 0 ? 0xff2050 : 0xf2f2f2,
          emissive: i % 2 === 0 ? 0x660018 : 0x222222,
          emissiveIntensity: 0.4
        })
      );
      kerb.position.set(x, 0.06, -i*4);
      kerbGroup.add(kerb);
    }
  });
  kerbGroup.visible = false;
  scene.add(kerbGroup);

  // 中央レーンの目印ライン(流れる感を出す、共有マテリアルでステージごとに切り替える)
  const lineMat = new THREE.MeshStandardMaterial({color:0xd9cbb0});
  const lineMarks = [];
  for(let i=0;i<20;i++){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 1.2), lineMat);
    m.rotation.x = -Math.PI/2;
    m.position.set(0, 0.01, -i*8);
    scene.add(m);
    lineMarks.push(m);
  }

  // ---------- ステージ1:江戸の街並み(町家) ----------
  function createEdoMachiya(){
    const group = new THREE.Group();
    const w = 3.5 + Math.random()*1.5;
    const h = 4 + Math.random()*3;
    const d = 3.2;

    // 建物本体(木造)
    const bodyMat = new THREE.MeshStandardMaterial({
      color: Math.random() < 0.5 ? COLOR_WOOD_A : COLOR_WOOD_B,
      roughness: 0.9
    });
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bodyMat);
    body.position.y = h/2;
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);

    // 瓦屋根(切妻風、軒が出た板)
    const roofMat = new THREE.MeshStandardMaterial({ color: COLOR_ROOF, roughness: 0.8 });
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w*1.3, 0.4, d*1.35), roofMat);
    roof.position.y = h + 0.2;
    roof.castShadow = true;
    group.add(roof);
    // 屋根の棟(頂部の飾り)
    const ridge = new THREE.Mesh(new THREE.BoxGeometry(w*1.32, 0.18, 0.3), roofMat);
    ridge.position.y = h + 0.5;
    group.add(ridge);

    // 提灯(軒先に吊るす赤い灯り)
    if (Math.random() < 0.6) {
      const lantern = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.18, 0.42, 8),
        new THREE.MeshStandardMaterial({ color: EDO_COLOR_LANTERN, emissive: 0x551100, emissiveIntensity: 0.5 })
      );
      lantern.position.set(w*0.28, h*0.72, d/2 + 0.15);
      group.add(lantern);
    }

    return group;
  }

  // ---------- ステージ2:ネオン都市の高層ビル ----------
  function createNeonSkyscraper(){
    const group = new THREE.Group();
    const w = 3.2 + Math.random()*1.8;
    const h = 8 + Math.random()*14;
    const d = 3.2;

    // ビル本体(ダークな躯体)
    const bodyMat = new THREE.MeshStandardMaterial({
      color: Math.random() < 0.5 ? COLOR_WOOD_A : COLOR_WOOD_B,
      roughness: 0.55,
      metalness: 0.3
    });
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bodyMat);
    body.position.y = h/2;
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);

    // 屋上の設備ブロック
    const roofMat = new THREE.MeshStandardMaterial({ color: COLOR_ROOF, roughness: 0.7 });
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w*0.5, 0.6, d*0.5), roofMat);
    roof.position.y = h + 0.3;
    roof.castShadow = true;
    group.add(roof);

    // 窓の発光ライン(横に何本か走らせる、ランダムな色)
    const rowCount = Math.max(3, Math.floor(h/2));
    for(let r=0;r<rowCount;r++){
      if (Math.random() < 0.55) continue; // 一部だけ点灯させて雑多な都市感を出す
      const winColor = NEON_ACCENTS[Math.floor(Math.random()*NEON_ACCENTS.length)];
      const win = new THREE.Mesh(
        new THREE.PlaneGeometry(w*0.9, 0.18),
        new THREE.MeshStandardMaterial({ color: winColor, emissive: winColor, emissiveIntensity: 1.4 })
      );
      win.position.set(0, r*2 + 1, d/2 + 0.01);
      group.add(win);
      const winBack = win.clone();
      winBack.rotation.y = Math.PI;
      winBack.position.z = -d/2 - 0.01;
      group.add(winBack);
    }

    // 縦のネオン看板(ビルの角に取り付ける、街灯代わり)
    if (Math.random() < 0.7) {
      const signColor = NEON_ACCENTS[Math.floor(Math.random()*NEON_ACCENTS.length)];
      const sign = new THREE.Mesh(
        new THREE.BoxGeometry(0.25, h*0.6, 0.25),
        new THREE.MeshStandardMaterial({ color: signColor, emissive: signColor, emissiveIntensity: 1.6 })
      );
      sign.position.set(w*0.45, h*0.35, d/2 + 0.2);
      group.add(sign);
    }

    return group;
  }

  // 走路の両脇に建物を並べる(スクロールに合わせて手前へ流し、奥で再利用する)
  // まずは標準の箱型モデルで配置しておき、Tripo3D等のGLBモデルが見つかれば後から差し替える。
  const buildings = [];
  const BUILDING_SPACING = 9;
  const BUILDING_ROWS = 14;
  const buildingSides = []; // 各建物がどちら側(-1:左 / 1:右)にあるか記録(向き調整用)
  for (let i=0; i<BUILDING_ROWS; i++){
    [-1, 1].forEach(function(side){
      const b = createEdoMachiya();
      const xOff = TOTAL_WIDTH/2 + 3 + Math.random()*1.5;
      b.position.set(side*xOff, 0, -i*BUILDING_SPACING - 10);
      scene.add(b);
      buildings.push(b);
      buildingSides.push(side);
    });
  }

  // ---------- Tripo3D等で作った街並み用GLBモデルの読み込み(任意) ----------
  // このHTMLと同じフォルダに指定名のGLBファイルを置くと、上の標準モデルと自動的に差し替わる。
  // 見つからない場合はそのまま標準の見た目(町家・ネオンビル)で遊べる(フォールバック)。
  // ステージ1(江戸)用と、ステージ2(ネオン都市)用でファイル名を分けている。
  const STAGE_SCENERY_URLS = {
    edo: {
      building: 'scenery-building.glb',        // 江戸パートで使う建物モデル
      obstacle: 'scenery-obstacle.glb'          // 江戸パートで使う障害物モデル
    },
    neon: {
      building: 'scenery-building-neon.glb',    // ネオン都市パートで使う建物モデル
      obstacle: 'scenery-obstacle-neon.glb'      // ネオン都市パートで使う障害物モデル
    }
  };
  const BUILDING_MODEL_SCALE = 5.5;  // 建物モデルの大きさ調整(このモデルは高さ1.0基準で作られているため5.5倍している)
  const OBSTACLE_MODEL_SCALE = 1.0;  // 障害物モデルの大きさ調整

  let obstacleTemplate = null; // 読み込めた場合、以後の障害物生成で使う雛形
  let buildingLoadToken = 0;   // ステージ切替時に古い読み込み結果を無視するための世代番号
  let obstacleLoadToken = 0;

  function loadSceneryModel(url, onSuccess){
    if (typeof GLTFLoader !== 'function' || !url) return;
    const loader = new GLTFLoader();
    loader.load(
      url,
      function onLoad(gltf){
        onSuccess(gltf.scene);
        console.log('街並み用モデルを読み込みました:', url);
      },
      undefined,
      function onError(){
        console.log('街並み用モデルが見つからないため、標準の見た目で続行します。(' + url + ')');
      }
    );
  }

  // 建物モデルの読み込み・差し替え(ステージ切替のたびに呼び直す)
  function loadBuildingModel(url){
    const myToken = ++buildingLoadToken;
    loadSceneryModel(url, function(template){
      if (myToken !== buildingLoadToken) return; // 別ステージへ切り替わっていたら無視
      buildings.forEach(function(oldGroup, idx){
        const clone = template.clone(true);
        clone.traverse(function(node){
          if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }
        });
        clone.scale.setScalar(BUILDING_MODEL_SCALE);
        clone.position.copy(oldGroup.position);
        // 道に面するように、左側の建物は反転させる
        clone.rotation.y = buildingSides[idx] < 0 ? Math.PI : 0;
        scene.remove(oldGroup);
        scene.add(clone);
        buildings[idx] = clone;
      });
    });
  }

  // 障害物モデルの読み込み(以後spawnObstacleで使用、ステージ切替のたびに呼び直す)
  function loadObstacleModel(url){
    const myToken = ++obstacleLoadToken;
    obstacleTemplate = null;
    loadSceneryModel(url, function(template){
      if (myToken !== obstacleLoadToken) return; // 別ステージへ切り替わっていたら無視
      obstacleTemplate = template;
    });
  }

  loadBuildingModel(STAGE_SCENERY_URLS.edo.building);
  loadObstacleModel(STAGE_SCENERY_URLS.edo.obstacle);

  // ---------- プレイヤー ----------
  // player: レーン移動・ジャンプで動かす親グループ(位置の基準はここ)
  // fallbackModel: 標準のカプセル+頭キャラ(GLB未使用時、または読み込み失敗時に表示)
  // customModel: Tripo3D等で作ったGLBモデルが読み込めたらここに入る
  const player = new THREE.Group();
  const fallbackModel = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: COLOR_SHU, roughness:0.5 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.6, 4, 8), bodyMat);
  body.castShadow = true;
  body.position.y = 0.6;
  fallbackModel.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), new THREE.MeshStandardMaterial({color:0xffe0bd}));
  head.position.y = 1.3;
  head.castShadow = true;
  fallbackModel.add(head);
  player.add(fallbackModel);
  scene.add(player);

  // ---------- GLBキャラクターモデルの読み込み ----------
  // Tripo3Dなどで生成したGLBファイルをこのHTMLと同じフォルダに置き、
  // 下のPLAYER_MODEL_URLにファイル名を指定すると自動で読み込んで差し替える。
  // 見つからない/読み込み失敗の場合は、そのまま今のカプセルキャラで遊べる(フォールバック)。
  const PLAYER_MODEL_URL = 'player-character.glb'; // ← Tripo3Dで作ったGLBのファイル名に変更
  const PLAYER_MODEL_SCALE = 1.0;    // モデルの大きさ調整(必要に応じて変更)
  const PLAYER_MODEL_Y_OFFSET = 0;   // モデルの足元の高さ調整(地面に埋まる/浮く場合に調整)

  let customModel = null;

  if (typeof GLTFLoader === 'function' && PLAYER_MODEL_URL) {
    const loader = new GLTFLoader();
    loader.load(
      PLAYER_MODEL_URL,
      function onLoad(gltf){
        customModel = gltf.scene;
        customModel.scale.setScalar(PLAYER_MODEL_SCALE);
        customModel.position.y = PLAYER_MODEL_Y_OFFSET;
        customModel.traverse(function(node){
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
          }
        });
        player.remove(fallbackModel);
        player.add(customModel);
        console.log('カスタムキャラクターモデルを読み込みました:', PLAYER_MODEL_URL);
      },
      undefined,
      function onError(err){
        // ファイルが無い/壊れている場合はここに来る → フォールバックのまま続行
        console.log('カスタムモデルが見つからないため、標準キャラクターで続行します。('+PLAYER_MODEL_URL+')');
      }
    );
  }

  const GROUND_Y = 0;
  let velY = 0;
  let isJumping = false;
  const GRAVITY = -0.028;
  const JUMP_VEL = 0.46;

  let currentLane = 1; // 0:左, 1:中央, 2:右
  const LANE_MOVE_SPEED = 0.22; // レーン間を移動する速さ(補間)

  player.position.set(lanePositions[currentLane], GROUND_Y, 0);

  function changeLane(dir){
    if(!running) return;
    const next = currentLane + dir;
    if(next < 0 || next > LANE_COUNT-1) return;
    currentLane = next;
  }

  // ---------- 障害物(ステージ1:木の樽 / ステージ2:ネオンのエネルギーパイロン) ----------
  const obstacles = [];
  const EDO_OBST_COLOR = 0x8a5a2b;      // 樽の木材色
  const EDO_OBST_BAND_COLOR = 0x3d2b1a; // 樽のたが(帯)の色
  const NEON_OBST_COLOR = 0x1a1230;     // パイロン本体色(ダークな金属)

  function createEdoBarrel(height){
    const radius = LANE_WIDTH*0.22;
    const group = new THREE.Group();
    const barrel = new THREE.Mesh(
      new THREE.CylinderGeometry(radius, radius*1.05, height, 14),
      new THREE.MeshStandardMaterial({ color: EDO_OBST_COLOR, roughness:0.85 })
    );
    barrel.castShadow = true;
    group.add(barrel);
    [height*0.32, -height*0.32].forEach(function(y){
      const band = new THREE.Mesh(
        new THREE.CylinderGeometry(radius*1.06, radius*1.11, height*0.12, 14),
        new THREE.MeshStandardMaterial({ color: EDO_OBST_BAND_COLOR, roughness:0.7 })
      );
      band.position.y = y;
      group.add(band);
    });
    return group;
  }

  function createNeonPylon(height){
    const radius = LANE_WIDTH*0.22;
    const neonColor = NEON_ACCENTS[Math.floor(Math.random()*NEON_ACCENTS.length)];
    const group = new THREE.Group();

    const pylon = new THREE.Mesh(
      new THREE.CylinderGeometry(radius*0.7, radius, height, 8),
      new THREE.MeshStandardMaterial({ color: NEON_OBST_COLOR, roughness:0.4, metalness:0.6 })
    );
    pylon.castShadow = true;
    group.add(pylon);

    // 上下に発光するリング(ネオンの帯)
    [height*0.32, -height*0.32].forEach(function(y){
      const band = new THREE.Mesh(
        new THREE.TorusGeometry(radius*1.05, 0.06, 8, 16),
        new THREE.MeshStandardMaterial({ color: neonColor, emissive: neonColor, emissiveIntensity: 1.5 })
      );
      band.rotation.x = Math.PI/2;
      band.position.y = y;
      group.add(band);
    });

    // 頂上の発光コア
    const core = new THREE.Mesh(
      new THREE.SphereGeometry(radius*0.4, 12, 12),
      new THREE.MeshStandardMaterial({ color: neonColor, emissive: neonColor, emissiveIntensity: 2.0 })
    );
    core.position.y = height*0.55;
    group.add(core);

    return group;
  }

  function spawnObstacle(){
    const height = 0.9; // ジャンプで越えられる高さ
    const lane = Math.floor(Math.random() * LANE_COUNT);
    let group;

    if (obstacleTemplate) {
      // Tripo3D等で作ったGLBモデルが読み込まれていれば、それを複製して使う
      group = obstacleTemplate.clone(true);
      group.traverse(function(node){
        if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }
      });
      group.scale.setScalar(OBSTACLE_MODEL_SCALE);
      group.position.set(lanePositions[lane], 0, -60 - Math.random()*10);
    } else {
      // 標準の見た目(現在のステージに合わせて樽 or ネオンパイロン)
      group = (currentStage === 'neon') ? createNeonPylon(height) : createEdoBarrel(height);
      group.position.set(lanePositions[lane], height/2, -60 - Math.random()*10);
    }

    group.userData.lane = lane;
    scene.add(group);
    obstacles.push(group);
  }

  // ---------- ステージ管理(800m走ったら江戸→ネオン都市に切り替える) ----------
  let currentStage = 'edo';
  const STAGE2_DISTANCE = 800; // このm数を超えたらステージ2(ネオン都市)へ

  // 建物一式を、現在の位置(スクロール量)を保ったまま新しい見た目に差し替える
  function regenerateBuildings(genFn){
    for (let idx=0; idx<buildings.length; idx++){
      const oldGroup = buildings[idx];
      const b = genFn();
      b.position.copy(oldGroup.position);
      scene.remove(oldGroup);
      scene.add(b);
      buildings[idx] = b;
    }
  }

  function applyEdoTheme(){
    scene.background = edoSkyTexture;
    scene.fog.color.setHex(0x8a6a58); scene.fog.near = 20; scene.fog.far = 75;
    groundMat.color.setHex(EDO_COLOR_LANE);
    sideGroundMat.color.setHex(EDO_COLOR_GROUND);
    laneDividerMat.color.setHex(0xd9cbb0);
    laneDividerMat.emissive.setHex(0x000000);
    laneDividerMat.emissiveIntensity = 0;
    laneDividerMat.opacity = 0.45;
    lineMat.color.setHex(0xd9cbb0);
    lineMat.emissive.setHex(0x000000);
    lineMat.emissiveIntensity = 0;
    kerbGroup.visible = false;
    hemi.color.setHex(0xffd9a0); hemi.groundColor.setHex(0x3b2b20); hemi.intensity = 0.95;
    sun.color.setHex(0xffb066); sun.intensity = 1.05;
    neonFill.intensity = 0;
    COLOR_WOOD_A = EDO_COLOR_WOOD_A;
    COLOR_WOOD_B = EDO_COLOR_WOOD_B;
    COLOR_ROOF = EDO_COLOR_ROOF;
    regenerateBuildings(createEdoMachiya);
    loadBuildingModel(STAGE_SCENERY_URLS.edo.building);
    loadObstacleModel(STAGE_SCENERY_URLS.edo.obstacle);
  }

  function applyNeonTheme(){
    scene.background = neonSkyTexture;
    scene.fog.color.setHex(0x1a0838); scene.fog.near = 20; scene.fog.far = 78;
    groundMat.color.setHex(NEON_COLOR_LANE);
    sideGroundMat.color.setHex(NEON_COLOR_GROUND);
    laneDividerMat.color.setHex(0x00e5ff);
    laneDividerMat.emissive.setHex(0x00e5ff);
    laneDividerMat.emissiveIntensity = 0.9;
    laneDividerMat.opacity = 0.75;
    lineMat.color.setHex(0x00e5ff);
    lineMat.emissive.setHex(0x00e5ff);
    lineMat.emissiveIntensity = 0.8;
    kerbGroup.visible = true;
    hemi.color.setHex(0x8a6bff); hemi.groundColor.setHex(0x120620); hemi.intensity = 0.85;
    sun.color.setHex(0x66d9ff); sun.intensity = 0.55;
    neonFill.intensity = 0.8;
    COLOR_WOOD_A = NEON_COLOR_WOOD_A;
    COLOR_WOOD_B = NEON_COLOR_WOOD_B;
    COLOR_ROOF = NEON_COLOR_ROOF;
    regenerateBuildings(createNeonSkyscraper);
    loadBuildingModel(STAGE_SCENERY_URLS.neon.building);
    loadObstacleModel(STAGE_SCENERY_URLS.neon.obstacle);
  }

  function switchStage(stageName){
    currentStage = stageName;
    if (stageName === 'neon') applyNeonTheme(); else applyEdoTheme();
  }

  // 画面中央に「ステージ2」等のメッセージを一時的に表示する
  const stageMsgEl = document.getElementById('stageMsg');
  let stageMsgTimer = null;
  function showStageMessage(text){
    stageMsgEl.textContent = text;
    stageMsgEl.classList.add('show');
    if (stageMsgTimer) clearTimeout(stageMsgTimer);
    stageMsgTimer = setTimeout(function(){ stageMsgEl.classList.remove('show'); }, 2600);
  }

  // ---------- 状態管理 ----------
  let running = false;
  let speed = 0.28;
  const SPEED_INC = 0.0006;
  let distance = 0;
  let stage2Triggered = false;
  let best = 0;
  try { best = parseFloat(localStorage.getItem('jumpRunnerBest') || '0'); } catch(e){}
  document.getElementById('best').textContent = 'ベスト: ' + Math.floor(best) + ' m';

  let spawnTimer = 0;
  let spawnInterval = 70;

  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  function resetGame(){
    obstacles.forEach(function(o){ scene.remove(o); });
    obstacles.length = 0;
    distance = 0;
    speed = 0.28;
    spawnTimer = 0;
    spawnInterval = 70;
    stage2Triggered = false;
    stageMsgEl.classList.remove('show');
    if (currentStage !== 'edo') switchStage('edo');
    currentLane = 1;
    player.position.set(lanePositions[currentLane], GROUND_Y, 0);
    velY = 0;
    isJumping = false;
    scoreEl.textContent = '0 m';
  }

  function jump(){
    if(!running) return;
    if(!isJumping){
      velY = JUMP_VEL;
      isJumping = true;
    }
  }

  function endGame(){
    running = false;
    if(distance > best){
      best = distance;
      try { localStorage.setItem('jumpRunnerBest', String(best)); } catch(e){}
    }
    document.getElementById('finalScoreVal') // placeholder guard (unused)
    document.getElementById('best').textContent = 'ベスト: ' + Math.floor(best) + ' m';
    overlay.innerHTML =
      '<h1>ゲームオーバー</h1>'+
      '<div id="finalScore">走った距離: <b>' + Math.floor(distance) + ' m</b></div>'+
      '<button id="restartBtn">もう一度</button>';
    overlay.classList.remove('hidden');
    document.getElementById('restartBtn').addEventListener('click', startGame);
  }

  function startGame(){
    resetGame();
    overlay.classList.add('hidden');
    running = true;
  }

  startBtn.addEventListener('click', startGame);

  // ---------- 入力 ----------
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      jump();
    } else if(e.code === 'ArrowLeft'){
      e.preventDefault();
      changeLane(-1);
    } else if(e.code === 'ArrowRight'){
      e.preventDefault();
      changeLane(1);
    }
  });

  // タップ=ジャンプ、左右スワイプ=レーン移動 を判定する
  let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
  const SWIPE_THRESHOLD = 40; // px

  window.addEventListener('pointerdown', function(e){
    touchStartX = e.clientX;
    touchStartY = e.clientY;
    touchStartTime = Date.now();
  });

  window.addEventListener('pointerup', function(e){
    const dx = e.clientX - touchStartX;
    const dy = e.clientY - touchStartY;
    const absDx = Math.abs(dx), absDy = Math.abs(dy);

    if(absDx > SWIPE_THRESHOLD && absDx > absDy){
      // 横スワイプ → レーン移動
      changeLane(dx > 0 ? 1 : -1);
    } else {
      // それ以外(タップ・軽いブレ)→ジャンプ
      jump();
    }
  });

  // ---------- リサイズ ----------
  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- 衝突判定(簡易AABB) ----------
  function checkCollision(obst){
    const px = player.position.x, pz = player.position.z, py = player.position.y;
    const dx = Math.abs(px - obst.position.x);
    const dz = Math.abs(pz - obst.position.z);
    const obstTop = obst.position.y + 0.45; // 障害物の上端
    const playerBottom = py; // プレイヤーの脚元
    const overlapXZ = dx < (LANE_WIDTH*0.35 + 0.35) && dz < (0.35 + 0.5);
    const notCleared = playerBottom < obstTop - 0.05;
    return overlapXZ && notCleared;
  }

  // ---------- メインループ ----------
  function animate(){
    requestAnimationFrame(animate);

    if(running){
      // 前進
      distance += speed * 0.6;
      speed += SPEED_INC;
      scoreEl.textContent = Math.floor(distance) + ' m';

      // 800m走ったらステージ2(ネオン都市)へ切り替え
      if(!stage2Triggered && distance >= STAGE2_DISTANCE){
        stage2Triggered = true;
        switchStage('neon');
        showStageMessage('ステージ2 : ネオン都市');
      }

      // ジャンプ物理
      velY += GRAVITY;
      player.position.y += velY;
      if(player.position.y <= GROUND_Y){
        player.position.y = GROUND_Y;
        velY = 0;
        isJumping = false;
      }

      // レーン移動(目標xへ滑らかに補間)
      const targetX = lanePositions[currentLane];
      player.position.x += (targetX - player.position.x) * LANE_MOVE_SPEED;
      // 移動方向に少し傾ける(演出)。カスタムモデルにも効くようplayer自体を傾ける
      player.rotation.z = (targetX - player.position.x) * -0.15;

      // レーンライン流し
      lineMarks.forEach(function(m){
        m.position.z += speed;
        if(m.position.z > 6){ m.position.z -= 20*8; }
      });

      // 街並み(町家)を手前へ流し、通り過ぎたら奥へ戻して再利用
      buildings.forEach(function(b){
        b.position.z += speed;
        if(b.position.z > 10){
          b.position.z -= BUILDING_ROWS * BUILDING_SPACING;
        }
      });

      // 障害物出現
      spawnTimer++;
      if(spawnTimer > spawnInterval){
        spawnTimer = 0;
        spawnInterval = Math.max(38, 70 - distance*0.05);
        spawnObstacle();
      }

      // 障害物移動・当たり判定・除去
      for(let i=obstacles.length-1; i>=0; i--){
        const o = obstacles[i];
        o.position.z += speed;
        if(checkCollision(o)){
          endGame();
        }
        if(o.position.z > 8){
          scene.remove(o);
          obstacles.splice(i,1);
        }
      }

      // わずかな上下バウンス(走ってる感)。カスタムモデルにも効くようplayer自体を揺らす
      player.rotation.x = Math.sin(distance*0.9) * 0.05;
    }

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
